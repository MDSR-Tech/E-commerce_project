version: '3.8'

services:
  # Spring Boot Backend
  backend:
    build:
      context: ./spring-backend/backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - ./spring-backend/backend/.env
    environment:
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./spring-backend/backend:/app
      - ~/.m2:/root/.m2
    networks:
      - ecommerce-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend/mdsrtech
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - INTERNAL_API_URL=http://backend:8080/api
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
    env_file:
      - ./spring-backend/backend/.env
    volumes:
      - ./frontend/mdsrtech:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
